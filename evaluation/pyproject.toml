[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluation-utils"
version = "0.1.0"
description = "Shared utilities for fastpmr evaluation scripts."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluation_utils"]

[tool.pixi.workspace]
name = "fastpmr-evaluation"
version = "0.1.0"
description = "Pixi environment for running fastpmr evaluations."
channels = ["conda-forge", "bioconda"]
platforms = [
    "linux-64",
    { name = "linux-64-gpu", platform = "linux-64", cuda = "12" },
    "osx-64",
    "osx-arm64",
]
requires-pixi = ">=0.72.2"

[tool.pixi.dependencies]
admixtools = ">=8.0.2,<9"
bash = ">=5.2.37,<6"
cartopy = ">=0.25.0,<0.26"
coreutils = ">=9.5,<10"
# Benchmark against bioconda package, not a local build
fastpmr = "==0.2.4"
findutils = ">=4.10.0,<5"
gpytorch = ">=1.15.2,<2"
haversine = ">=2.9.0,<3"
matplotlib = ">=3.10.8,<4"
numpy = ">=2.4.1,<3"
pandas = ">=3.0.1,<4"
pytest = ">=9.0.3,<10"
python = ">=3.10,<3.15"
pytorch = ">=2.10.0,<3"
samtools = ">=1.21,<2"
scipy = ">=1.17.0,<2"
seaborn = ">=0.13.2,<0.14"
wget = ">=1.25.0,<2"

[tool.pixi.pypi-dependencies]
evaluation-utils = { path = ".", editable = true }
plinkio = ">=0.9.8, <0.10"
reverse_geocoder = ">=1.5.1, <2"

[tool.pixi.environments]
eager = { features = ["eager"], no-default-feature = true }
gpu = { features = ["gpu"] }

# (Optional) GPU feature for the GP analysis
[tool.pixi.feature.gpu]
platforms = ["linux-64-gpu"]

[tool.pixi.feature.gpu.dependencies]
pytorch-gpu = ">=2.10.0,<3"

# See the plain gp-pipeline below for non-GPU runs
[tool.pixi.feature.gpu.tasks]
gp-pipeline-gpu = [
    { task = "fit-gp-aadr", environment = "gpu" },
]

# nf-core/eager 2.4.0 is a DSL1 pipeline, so nextflow must be <= 22.10.6, which
# pins an old libcurl (<8) that conflicts with samtools and the analysis stack
[tool.pixi.feature.eager.dependencies]
python = ">=3.10,<3.15"
nextflow = ">=22,<=22.10.6"

[tool.pixi.feature.eager.pypi-dependencies]
evaluation-utils = { path = ".", editable = true }

[tool.pixi.feature.eager.tasks]
eager-chichen-itza = "python chichen_itza/run_eager.py"

[tool.pixi.tasks]
prepare-aadr = "python aadr/prepare_data.py"
fastpmr-aadr = "python aadr/run_fastpmr.py"
scan-aadr = "python aadr/scan_pmrs.py"
plot-aadr = "python aadr/plot_results.py"
fit-gp-aadr = "python aadr/fit_gp.py"

prepare-aadr-v62 = "python aadr_v62/prepare_data.py"
fastpmr-aadr-v62 = "python aadr_v62/run_fastpmr.py"
scan-aadr-v62 = "python aadr_v62/scan_pmrs.py"

prepare-performance = "python performance/prepare_data.py"
samples-benchmark = "python performance/run_sample_count_benchmark.py"
variants-benchmark = "python performance/run_variant_count_benchmark.py"
threads-benchmark = "python performance/run_thread_count_benchmark.py"
plot-performance = "python performance/plot_results.py"

# Chichen Itza pipeline: prepare-bams -> eager -> fastpmr.
# eager-chichen-itza runs in the isolated "eager" env, so there's no Pixi pipeline.
prepare-bams-chichen-itza = "python chichen_itza/prepare_bams.py"
fastpmr-chichen-itza = "python chichen_itza/run_fastpmr.py"

prepare-comparison = "python comparison/prepare_data.py"
readv2-benchmark = "python comparison/run_readv2_benchmark.py"
plot-comparison = "python comparison/plot_results.py"

test = "python -m pytest tests/"

aadr-pipeline = [
    { task = "prepare-aadr" },
    { task = "fastpmr-aadr" },
    { task = "scan-aadr" },
    { task = "plot-aadr" },
]
gp-pipeline = [
    { task = "fit-gp-aadr" },
]
aadr-v62-pipeline = [
    { task = "prepare-aadr-v62" },
    { task = "fastpmr-aadr-v62" },
    { task = "scan-aadr-v62" },
]
performance-pipeline = [
    { task = "prepare-performance" },
    { task = "samples-benchmark" },
    { task = "variants-benchmark" },
    { task = "threads-benchmark" },
    { task = "plot-performance" },
]
comparison-pipeline = [
    { task = "prepare-comparison" },
    { task = "readv2-benchmark" },
    { task = "plot-comparison" },
]

[tool.ruff]
line-length = 120
exclude = ["comparison/READv2/READ2.py"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
]
